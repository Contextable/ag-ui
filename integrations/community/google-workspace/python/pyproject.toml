[project]
name = "ag-ui-google-workspace-agent"
version = "0.1.0"
description = "AG-UI backend agent for the Google Workspace Add-on. An ADK-based assistant with cross-surface memory for Gmail, Calendar, Docs, and Chat."
authors = [
    { name = "AG-UI Protocol Contributors" },
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "ag-ui-adk",
    "google-adk>=1.30.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "a2ui-agent-sdk>=0.2.2",
    # Used directly by web_search.py for Tavily HTTP calls. Already pulled
    # in transitively by ADK/uvicorn but pin explicitly since it's part of
    # this package's API surface now.
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.sources]
ag-ui-adk = { path = "../../../adk-middleware/python", editable = true }
a2ui-agent-sdk = { git = "https://github.com/google/A2UI.git", subdirectory = "agent_sdks/python", rev = "609ab52c0511e29d01c5395b024c8170cb507917" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ag_ui_google_workspace_agent"]

[project.scripts]
ag-ui-google-workspace-agent = "ag_ui_google_workspace_agent.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
