# Railway service config for the AG-UI Google Workspace Add-on (TS).
#
# Setup in Railway:
#   - Create a service from this monorepo, branch feat/google-workspace-integration
#   - Set Root Directory to: integrations/community/google-workspace/typescript
#     (the build is self-contained in this folder — no monorepo context
#     needed; the Dockerfile installs @ag-ui/* from npm)
#   - Required environment variables:
#     - ACTION_BASE_URL: the public URL of THIS service
#         (e.g. https://gws-addon.up.railway.app)
#     - AGUI_DEFAULT_BACKEND_URL: the Python agent's internal URL
#         (e.g. http://${{gws-agent.RAILWAY_PRIVATE_DOMAIN}}:${{gws-agent.PORT}}/)
#   - Optional:
#     - GOOGLE_CLOUD_PROJECT / FIRESTORE_PROJECT_ID for Firestore session store

[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
